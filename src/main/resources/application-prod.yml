# 应用服务 WEB 访问端口
spring:
  application:
    name: ai-code-helper
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cw-ai}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
server:
  port: 8881
  servlet:
    context-path: /api

# 大模型api
langChain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key:  ${LANGCHAIN4J_API_KEY}
      embedding-model:
        model-name: text-embedding-async-v1
        api-key:  ${LANGCHAIN4J_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        api-key:  ${LANGCHAIN4J_API_KEY}
mcp:
  baiduZP:
    apiKey: ${BAIDUZP_API_KEY} # 百度智能云


#  minio
minio:
  endpoint: http://127.0.0.1:9000
  access-key: ${minio_user}
  secret-key: ${minio_password}
  bucket-name: cw-ai
  # 外部访问地址，用于生成预览签名链接
  external-endpoint: http://127.0.0.1:9000
