# 应用服务 WEB 访问端口
spring:
  application:
    name: ai-code-helper
server:
  port: 8081
  servlet:
    context-path: /api

# 大模型api
langChain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key:  ${LANGCHAIN4J_API_KEY}
      embedding-model:
        model-name: text-embedding-v3 # 经济情况良好也可选择 text-embedding-v4，免费额度有 qwen3.7-text-embedding text-embedding-v1 text-embedding-v2 text-embedding-v3
        api-key:  ${LANGCHAIN4J_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        api-key:  ${LANGCHAIN4J_API_KEY}
mcp:
  baiduZP:
    apiKey: ${BAIDUZP_API_KEY} # 百度智能云