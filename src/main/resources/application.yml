# 应用服务 WEB 访问端口
spring:
  application:
    name: ai-code-helper
  profiles:
    active: prod
#   active: local
server:
  port: 8881
  servlet:
    context-path: /api


# MyBatis-Plus 配置（实体为生成器 snake_case 字段风格，关闭驼峰映射）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml,classpath*:/generator/mapper/**/*.xml
  type-aliases-package: com.example.aicodehelper.domain
  configuration:
    map-underscore-to-camel-case: false

# JWT 令牌配置
token:
  header: Authorization
  prefix: "Bearer "
  secret: ${TOKEN_SECRET:ai-code-helper-textile-agent-jwt-secret-key-2026}
  expire-minutes: 720

#  minio
minio:
  endpoint: http://127.0.0.1:9000
  access-key: textile_admin
  secret-key: YourStrongPass_2026
  bucket-name: textile-knowledge
  # 外部访问地址，用于生成预览签名链接
  external-endpoint: http://127.0.0.1:9000